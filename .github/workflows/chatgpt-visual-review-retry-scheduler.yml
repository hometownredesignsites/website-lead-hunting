name: Schedule ChatGPT visual review retries

on:
  schedule:
    # Offset from the top of the hour to avoid the busiest schedule minute.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Serialize with lead-hunt and review-merge commits so queue updates cannot race.
concurrency:
  group: website-lead-hunt-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch_due_retries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5

      - name: Dispatch due retries with available source artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python tools/dispatch_due_visual_review_retries.py

      - name: Commit retry queue updates
        if: always()
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- 'runs/*/CHATGPT_VISUAL_REVIEW_RETRY_QUEUE.json')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- runs/*/CHATGPT_VISUAL_REVIEW_RETRY_QUEUE.json
            git commit -m "Update ChatGPT visual review retry queue"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No retry queue changes to commit."
          fi
