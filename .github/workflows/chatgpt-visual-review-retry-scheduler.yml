name: Schedule Duck.ai visual review retries

on:
  schedule:
    # Offset from the top of the hour to avoid the busiest schedule minute.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Serialize private retry-queue writes with lead-hunt and review-score commits.
concurrency:
  group: website-lead-hunt-private-operations-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  dispatch_due_retries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5

      - name: Check out private operations data
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/website-lead-hunting-operations
          ref: git-duckai
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          persist-credentials: false
          path: private-results

      - name: Check out shared private configuration
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/website-lead-hunting-operations
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          persist-credentials: false
          path: private-config

      - name: Load retry queues from private repository
        run: python tools/private_results.py copy-in --private-repo private-results --config-repo private-config

      - name: Prepare due retries with available source artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python tools/dispatch_due_visual_review_retries.py

      - name: Commit retry reservations before dispatch
        if: always()
        shell: bash
        env:
          PRIVATE_RESULTS_TOKEN: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
        run: |
          python tools/private_results.py commit-runs --private-repo private-results \
            --message "Update Duck.ai visual review retry queue"

      - name: Dispatch committed retry reservations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python tools/dispatch_due_visual_review_retries.py --dispatch-ready

      - name: Commit retry dispatch outcomes
        if: always()
        shell: bash
        env:
          PRIVATE_RESULTS_TOKEN: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
        run: |
          python tools/private_results.py commit-runs --private-repo private-results \
            --message "Record Duck.ai visual review retry dispatch"
