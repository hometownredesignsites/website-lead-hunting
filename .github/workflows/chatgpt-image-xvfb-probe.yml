name: ChatGPT guest image attachment probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-image-xvfb-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install chromium
          mkdir -p artifacts/chatgpt-image-xvfb-probe

      - name: Create a temporary screenshot with a unique visual answer
        run: |
          python tools/create_chatgpt_image_probe.py \
            --output artifacts/chatgpt-image-xvfb-probe/image-probe.png
          cat > artifacts/chatgpt-image-xvfb-probe/prompt.txt <<'EOF'
          Inspect the attached screenshot. Return exactly this JSON object with the values you can read from the image:
          {"visible_code":"...","circle_color":"..."}
          If you cannot access the image, return {"error":"image_not_accessible"}. Do not guess.
          EOF

      - name: Attach screenshot and ask ChatGPT as a guest under Xvfb
        id: probe
        run: |
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python tools/chatgpt_file_playwright_anonymous_ci.py \
              --stage-name chatgpt_guest_image_probe \
              --input-file artifacts/chatgpt-image-xvfb-probe/prompt.txt \
              --image-file artifacts/chatgpt-image-xvfb-probe/image-probe.png \
              --output-file artifacts/chatgpt-image-xvfb-probe/response.md \
              --metadata-output-file artifacts/chatgpt-image-xvfb-probe/metadata.json \
              --success-screenshot artifacts/chatgpt-image-xvfb-probe/chatgpt-response.png \
              --error-screenshot artifacts/chatgpt-image-xvfb-probe/chatgpt-error.png \
              --user-data-dir tmp/chatgpt-image-probe-profile \
              --allow-retry \
              --refresh-before-retry \
              --wait-seconds 70 \
              --timeout-ms 120000 \
              --post-response-wait-seconds 2 \
              --response-settle-seconds 2 \
              --max-settle-wait-seconds 30
          probe_rc=$?
          if [[ "$probe_rc" -eq 0 ]]; then
            python tools/validate_chatgpt_image_probe.py \
              --response artifacts/chatgpt-image-xvfb-probe/response.md \
              --metadata artifacts/chatgpt-image-xvfb-probe/metadata.json \
              --output artifacts/chatgpt-image-xvfb-probe/probe-result.json || probe_rc=$?
          fi
          echo "exit_code=$probe_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload image probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chatgpt-image-xvfb-probe-${{ github.run_id }}
          path: artifacts/chatgpt-image-xvfb-probe/
          if-no-files-found: warn
          retention-days: 7

      - name: Report probe outcome
        if: always() && steps.probe.outputs.exit_code != '0'
        run: |
          echo "Image attachment or visual recognition check failed. Download the artifact for response and UI diagnostics."
          exit 1
