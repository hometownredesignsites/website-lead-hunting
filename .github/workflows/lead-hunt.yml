name: ChatGPT website lead hunt

on:
  workflow_dispatch:
    inputs:
      run_key:
        description: "Stable run folder key; reuse it to continue the same saved run"
        required: true
        default: "csv-market-lead-hunt"
        type: string
      region:
        description: "Human-readable market/region label for reports"
        required: true
        default: "Colorado"
        type: string
      max_queries:
        description: "Pending queries to process in this batch (1-20)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "10"
          - "20"
      max_sites_per_query:
        description: "Direct business websites to assess per query (1-10)"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "8"
          - "10"
      capture_google_evidence:
        description: "Capture raw Google result pages for this bounded comparison batch"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: website-lead-hunt-${{ github.repository }}-${{ github.ref_name }}
  queue: max
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install chromium

      - name: Run offline regression checks
        run: python -m unittest discover -s tests -v

      - name: Plan CSV query volume
        shell: bash
        env:
          MAX_SITES_PER_QUERY: ${{ inputs.max_sites_per_query }}
          MAX_QUERIES: ${{ inputs.max_queries }}
        run: |
          python tools/plan_run.py --max-sites-per-query "$MAX_SITES_PER_QUERY" \
            --queries-per-job "$MAX_QUERIES" | tee plan.json
          {
            echo '## CSV query plan'
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded ChatGPT research and website assessment batch
        id: scan
        shell: bash
        env:
          RUN_KEY: ${{ inputs.run_key }}
          REGION: ${{ inputs.region }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          MAX_SITES_PER_QUERY: ${{ inputs.max_sites_per_query }}
          CAPTURE_GOOGLE_EVIDENCE: ${{ inputs.capture_google_evidence }}
        run: |
          if ! [[ "$RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo "run_key must contain only letters, digits, dot, underscore, and hyphen" >&2
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p runs
          capture_args=()
          if [[ "$CAPTURE_GOOGLE_EVIDENCE" == "true" ]]; then
            capture_args+=(--capture-google-evidence)
          fi
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python tools/lead_hunt.py \
              --engine chatgpt \
              --categories-csv config/business_categories.csv \
              --cities-csv config/cities.csv \
              --region "$REGION" \
              --state-dir "runs/$RUN_KEY" \
              --max-queries "$MAX_QUERIES" \
              --max-sites-per-query "$MAX_SITES_PER_QUERY" \
              "${capture_args[@]}"
          scan_rc=$?
          echo "exit_code=$scan_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate ledgers and write run summary
        id: validate
        if: always()
        shell: bash
        env:
          RUN_KEY: ${{ inputs.run_key }}
        run: |
          if ! [[ "$RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || [[ ! -d "runs/$RUN_KEY" ]]; then
            echo "No run folder to validate."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python tools/validate_run.py --run-dir "runs/$RUN_KEY" --write-summary > run-validation.json
          validation_rc=$?
          set -e
          cat run-validation.json
          if [[ -f "runs/$RUN_KEY/RUN_SUMMARY.md" ]]; then
            cat "runs/$RUN_KEY/RUN_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "exit_code=$validation_rc" >> "$GITHUB_OUTPUT"

      - name: Export high and medium candidates
        if: always()
        env:
          RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [[ -f "runs/$RUN_KEY/CANDIDATE_LEDGER.jsonl" ]]; then
            python tools/export_high_medium_candidates.py --run-dir "runs/$RUN_KEY"
          fi

      - name: Commit text findings to the selected branch
        if: always()
        shell: bash
        env:
          RUN_KEY: ${{ inputs.run_key }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! [[ "$RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || [[ ! -d "runs/$RUN_KEY" ]]; then
            echo "No safe run directory to commit."
            exit 0
          fi
          if [[ -n "$(git status --porcelain -- "runs/$RUN_KEY")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "runs/$RUN_KEY"
            while IFS= read -r -d '' staged_path; do
              case "${staged_path,,}" in
                *.png|*.jpg|*.jpeg|*.webp|*.gif)
                  git reset -q -- "$staged_path"
                  ;;
              esac
            done < <(git diff --cached --name-only -z -- "runs/$RUN_KEY")
            if ! git diff --cached --quiet; then
              git commit -m "Record website lead-hunt batch: $RUN_KEY"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            else
              echo "No commit-worthy run data after applying screenshot setting."
            fi
          else
            echo "No new run data to commit."
          fi

      - name: Upload a short-lived backup artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lead-hunt-${{ inputs.run_key }}-${{ github.run_id }}
          path: runs/${{ inputs.run_key }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Report scan or validation outcome
        if: always() && (steps.scan.outputs.exit_code != '0' || steps.validate.outputs.exit_code != '0')
        run: |
          echo "Lead-hunt runner exited with ${{ steps.scan.outputs.exit_code }}; validator exited with ${{ steps.validate.outputs.exit_code }}. Any progress and evidence were committed when available."
          exit 1
