name: ChatGPT website lead hunt
run-name: ChatGPT website lead hunt ${{ inputs.run_key }} campaign=${{ inputs.campaign_key || inputs.city_campaign_key }} batch=${{ inputs.campaign_batch }} attempt=${{ inputs.campaign_attempt }}

on:
  workflow_dispatch:
    inputs:
      run_key:
        description: "Stable run folder key; reuse it to continue the same saved run"
        required: true
        default: "csv-market-lead-hunt"
        type: string
      region:
        description: "Human-readable market/region label for reports"
        required: true
        default: "Colorado"
        type: string
      max_queries:
        description: "Pending queries to process in this batch (1-20)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "10"
          - "20"
      max_sites_per_query:
        description: "Direct business websites to assess per query (1-10)"
        required: true
        default: "10"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "8"
          - "10"
      capture_google_evidence:
        description: "Capture raw Google result pages for this bounded comparison batch"
        required: true
        default: false
        type: boolean
      campaign_key:
        description: "Managed by the campaign coordinator; leave blank for a standalone batch"
        required: false
        default: ""
        type: string
      campaign_batch:
        description: "Managed by the campaign coordinator"
        required: false
        default: "0"
        type: string
      campaign_attempt:
        description: "Managed by the campaign coordinator"
        required: false
        default: "0"
        type: string
      city_campaign_key:
        description: "Managed by the city-upload campaign coordinator"
        required: false
        default: ""
        type: string
      city_campaign_category_index:
        description: "One-based business type row from the campaign category snapshot"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: website-lead-hunt-private-operations-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Check out private operations data
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/website-lead-hunting-operations
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          persist-credentials: false
          path: private-results

      - name: Load configuration and checkpoints from private repository
        run: python tools/private_results.py copy-in --private-repo private-results

      - name: Prepare this city campaign category and city snapshot
        if: inputs.city_campaign_key != ''
        env:
          CITY_CAMPAIGN_KEY: ${{ inputs.city_campaign_key }}
          CITY_CATEGORY_INDEX: ${{ inputs.city_campaign_category_index }}
          RUN_KEY: ${{ inputs.run_key }}
        run: |
          python tools/prepare_city_campaign_inputs.py \
            --campaign-run-dir "runs/$CITY_CAMPAIGN_KEY" \
            --category-index "$CITY_CATEGORY_INDEX" \
            --output-dir "work/city-campaign/$RUN_KEY"

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install chromium

      - name: Run offline regression checks
        run: python -m unittest discover -s tests -v

      - name: Plan CSV query volume
        shell: bash
        env:
          MAX_SITES_PER_QUERY: ${{ inputs.max_sites_per_query }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          RUN_KEY: ${{ inputs.run_key }}
          CITY_CAMPAIGN_KEY: ${{ inputs.city_campaign_key }}
        run: |
          args=(--max-sites-per-query "$MAX_SITES_PER_QUERY" --queries-per-job "$MAX_QUERIES")
          if [[ -n "$CITY_CAMPAIGN_KEY" ]]; then
            args+=(--categories-csv "work/city-campaign/$RUN_KEY/business_categories.csv"
              --cities-csv "work/city-campaign/$RUN_KEY/cities.csv")
          fi
          python tools/plan_run.py "${args[@]}" | tee plan.json
          {
            echo '## CSV query plan'
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded ChatGPT research and website assessment batch
        id: scan
        shell: bash
        env:
          RUN_KEY: ${{ inputs.run_key }}
          REGION: ${{ inputs.region }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          MAX_SITES_PER_QUERY: ${{ inputs.max_sites_per_query }}
          CAPTURE_GOOGLE_EVIDENCE: ${{ inputs.capture_google_evidence }}
          CAMPAIGN_KEY: ${{ inputs.campaign_key }}
          CAMPAIGN_BATCH: ${{ inputs.campaign_batch }}
          CAMPAIGN_ATTEMPT: ${{ inputs.campaign_attempt }}
          CITY_CAMPAIGN_KEY: ${{ inputs.city_campaign_key }}
          CITY_CATEGORY_INDEX: ${{ inputs.city_campaign_category_index }}
        run: |
          if ! [[ "$RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo "run_key must contain only letters, digits, dot, underscore, and hyphen" >&2
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$CAMPAIGN_KEY" ]]; then
            if ! [[ "$CAMPAIGN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || \
               [[ "$CAMPAIGN_KEY" != "$RUN_KEY" ]] || \
               ! [[ "$CAMPAIGN_BATCH" =~ ^[1-9][0-9]*$ ]] || \
               ! [[ "$CAMPAIGN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo "Campaign metadata is invalid or does not match run_key" >&2
              echo "exit_code=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "$CAMPAIGN_BATCH" != "0" || "$CAMPAIGN_ATTEMPT" != "0" ]]; then
            echo "Campaign batch and attempt require a campaign_key" >&2
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          categories_csv="config/business_categories.csv"
          cities_csv="config/cities.csv"
          if [[ -n "$CITY_CAMPAIGN_KEY" ]]; then
            if ! [[ "$CITY_CAMPAIGN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || \
               ! [[ "$CITY_CATEGORY_INDEX" =~ ^[1-9][0-9]*$ ]]; then
              echo "City campaign metadata is invalid" >&2
              echo "exit_code=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            categories_csv="work/city-campaign/$RUN_KEY/business_categories.csv"
            cities_csv="work/city-campaign/$RUN_KEY/cities.csv"
            if [[ ! -f "$categories_csv" || ! -f "$cities_csv" ]]; then
              echo "Prepared city campaign inputs are missing" >&2
              echo "exit_code=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "$CITY_CATEGORY_INDEX" != "0" ]]; then
            echo "city_campaign_category_index requires city_campaign_key" >&2
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p runs
          capture_args=()
          if [[ "$CAPTURE_GOOGLE_EVIDENCE" == "true" ]]; then
            capture_args+=(--capture-google-evidence)
          fi
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python tools/lead_hunt.py \
              --engine chatgpt \
              --categories-csv "$categories_csv" \
              --cities-csv "$cities_csv" \
              --region "$REGION" \
              --state-dir "runs/$RUN_KEY" \
              --max-queries "$MAX_QUERIES" \
              --max-sites-per-query "$MAX_SITES_PER_QUERY" \
              "${capture_args[@]}"
          scan_rc=$?
          echo "exit_code=$scan_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate ledgers and write run summary
        id: validate
        if: always()
        shell: bash
        env:
          RUN_KEY: ${{ inputs.run_key }}
        run: |
          if ! [[ "$RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || [[ ! -d "runs/$RUN_KEY" ]]; then
            echo "No run folder to validate."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python tools/validate_run.py --run-dir "runs/$RUN_KEY" --write-summary > run-validation.json
          validation_rc=$?
          set -e
          cat run-validation.json
          if [[ -f "runs/$RUN_KEY/RUN_SUMMARY.md" ]]; then
            cat "runs/$RUN_KEY/RUN_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "exit_code=$validation_rc" >> "$GITHUB_OUTPUT"

      - name: Export high and medium candidates
        if: always()
        env:
          RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [[ -f "runs/$RUN_KEY/CANDIDATE_LEDGER.jsonl" ]]; then
            python tools/export_high_medium_candidates.py --run-dir "runs/$RUN_KEY"
          fi

      - name: Commit text findings to the private results repository
        if: always()
        shell: bash
        env:
          RUN_KEY: ${{ inputs.run_key }}
          PRIVATE_RESULTS_TOKEN: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
        run: |
          if ! [[ "$RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || [[ ! -d "runs/$RUN_KEY" ]]; then
            echo "No safe run directory to commit."
            exit 0
          fi
          python tools/private_results.py commit-run --private-repo private-results \
            --run-key "$RUN_KEY" --message "Record website lead-hunt batch: $RUN_KEY"

      - name: Upload a short-lived backup artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lead-hunt-${{ inputs.run_key }}-${{ github.run_id }}
          path: runs/${{ inputs.run_key }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Report scan or validation outcome
        if: always() && (steps.scan.outputs.exit_code != '0' || steps.validate.outputs.exit_code != '0')
        run: |
          echo "Lead-hunt runner exited with ${{ steps.scan.outputs.exit_code }}; validator exited with ${{ steps.validate.outputs.exit_code }}. Any progress and evidence were committed when available."
          exit 1

  notify_campaign:
    needs: hunt
    if: always() && inputs.campaign_key != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch campaign checkpoint after the lead-hunt job completes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
          RUN_KEY: ${{ inputs.run_key }}
          CHILD_RUN_ID: ${{ github.run_id }}
          CHILD_CONCLUSION: ${{ needs.hunt.result }}
        run: |
          payload=$(jq -n \
            --arg ref "$TARGET_REF" \
            --arg run_key "$RUN_KEY" \
            --arg child_run_id "$CHILD_RUN_ID" \
            --arg child_conclusion "$CHILD_CONCLUSION" \
            '{ref:$ref,inputs:{mode:"after-run",run_key:$run_key,child_run_id:$child_run_id,child_conclusion:$child_conclusion}}')
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/lead-hunt-campaign.yml/dispatches" \
              --data "$payload"; then
              echo "Campaign completion callback dispatched for lead-hunt run $CHILD_RUN_ID."
              exit 0
            fi
            echo "Callback dispatch attempt $attempt failed." >&2
            sleep 5
          done
          echo "Campaign completion callback could not be dispatched after three attempts." >&2
          exit 1

  notify_city_campaign:
    needs: hunt
    if: always() && inputs.city_campaign_key != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch city campaign checkpoint after lead hunt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
          CITY_CAMPAIGN_KEY: ${{ inputs.city_campaign_key }}
          CHILD_RUN_ID: ${{ github.run_id }}
          CHILD_CONCLUSION: ${{ needs.hunt.result }}
        run: |
          payload=$(jq -n \
            --arg ref "$TARGET_REF" \
            --arg campaign_key "$CITY_CAMPAIGN_KEY" \
            --arg child_run_id "$CHILD_RUN_ID" \
            --arg child_conclusion "$CHILD_CONCLUSION" \
            '{ref:$ref,inputs:{mode:"after-lead-hunt",campaign_key:$campaign_key,child_run_id:$child_run_id,child_conclusion:$child_conclusion}}')
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/city-upload-campaign.yml/dispatches" \
              --data "$payload"; then
              echo "City campaign notified for lead-hunt run $CHILD_RUN_ID."
              exit 0
            fi
            echo "City campaign callback attempt $attempt failed." >&2
            sleep 5
          done
          echo "City campaign callback could not be dispatched after three attempts." >&2
          exit 1
