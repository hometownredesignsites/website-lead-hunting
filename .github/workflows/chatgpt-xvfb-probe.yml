name: ChatGPT Xvfb runner check

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to submit using the ChatGPT guest browser runner"
        required: true
        default: "Find independent kitchen remodelers serving Westminster, Colorado, with direct official website URLs and source URLs supporting service in the area. Do not invent businesses or URLs."
        type: string
      attach_test_image:
        description: "Attach a temporary screenshot and check whether ChatGPT can read it"
        required: true
        default: false
        type: boolean
      review_saved_candidate:
        description: "Score four saved desktop and mobile website screenshots"
        required: true
        default: false
        type: boolean
      review_run_key:
        description: "Run key whose candidate and screenshots should be reviewed"
        required: true
        default: "westminster-kitchen-selector-test-20261101"
        type: string
      review_source_run_id:
        description: "Lead-hunt Actions run ID containing the screenshots artifact (required when reviewing a saved candidate)"
        required: false
        default: ""
        type: string
      review_candidate_id:
        description: "Candidate ID from that run's CANDIDATE_LEDGER.jsonl"
        required: true
        default: "0001-kakitchenremodelsandmore_com"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: chatgpt-xvfb-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install chromium
          mkdir -p artifacts/chatgpt-xvfb-probe tmp
          rm -rf tmp/chatgpt-probe-profile

      - name: Create a temporary screenshot fixture when requested
        if: inputs.attach_test_image
        run: |
          python tools/create_chatgpt_image_probe.py \
            --output artifacts/chatgpt-xvfb-probe/image-probe.png

      - name: Validate saved-candidate selection
        if: inputs.review_saved_candidate
        id: review_selection
        shell: bash
        env:
          REVIEW_RUN_KEY: ${{ inputs.review_run_key }}
          REVIEW_SOURCE_RUN_ID: ${{ inputs.review_source_run_id }}
        run: |
          if ! [[ "$REVIEW_RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo "review_run_key contains invalid characters" >&2
            exit 1
          fi
          if [[ -z "$REVIEW_SOURCE_RUN_ID" ]]; then
            echo "review_source_run_id is required: visual review reads screenshots only from the lead-hunt artifact." >&2
            exit 1
          fi
          if ! [[ "$REVIEW_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "review_source_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          fi
          echo "run_key=$REVIEW_RUN_KEY" >> "$GITHUB_OUTPUT"

      - name: Download lead-hunt artifact for saved-candidate review
        if: inputs.review_saved_candidate
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lead-hunt-${{ steps.review_selection.outputs.run_key }}-${{ inputs.review_source_run_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.review_source_run_id }}
          path: artifacts/lead-hunt-source/runs/${{ steps.review_selection.outputs.run_key }}

      - name: Prepare saved candidate screenshots for visual review
        if: inputs.review_saved_candidate
        shell: bash
        env:
          REVIEW_RUN_KEY: ${{ inputs.review_run_key }}
          REVIEW_CANDIDATE_ID: ${{ inputs.review_candidate_id }}
          REVIEW_SOURCE_RUN_ID: ${{ inputs.review_source_run_id }}
        run: |
          ARTIFACT_RUN_DIR="artifacts/lead-hunt-source/runs/$REVIEW_RUN_KEY"
          if [[ ! -f "$ARTIFACT_RUN_DIR/CANDIDATE_LEDGER.jsonl" ]]; then
            echo "Lead-hunt artifact is unavailable or expired; checked-out repository screenshots are not used as a fallback." >&2
            exit 1
          fi
          echo "Using lead-hunt artifact from Actions run $REVIEW_SOURCE_RUN_ID."
          python tools/prepare_chatgpt_visual_review.py \
            --run-dir "$ARTIFACT_RUN_DIR" \
            --candidate-id "$REVIEW_CANDIDATE_ID" \
            --output-dir artifacts/chatgpt-xvfb-probe/website-review

      - name: Submit prompt with the ChatGPT runner under Xvfb
        id: probe
        shell: bash
        env:
          CHATGPT_PROMPT: ${{ inputs.prompt }}
          ATTACH_TEST_IMAGE: ${{ inputs.attach_test_image }}
          REVIEW_SAVED_CANDIDATE: ${{ inputs.review_saved_candidate }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path("artifacts/chatgpt-xvfb-probe")
          attach_image = os.environ["ATTACH_TEST_IMAGE"].lower() == "true"
          review_candidate = os.environ["REVIEW_SAVED_CANDIDATE"].lower() == "true"
          if attach_image and review_candidate:
              raise SystemExit("Choose either Attach test image or Review saved candidate")
          review_dir = root / "website-review"
          prompt = (
              (review_dir / "prompt.txt").read_text(encoding="utf-8").strip()
              if review_candidate else
              "Inspect the attached screenshot and return exactly this JSON: "
              "{\"visible_code\":\"...\",\"circle_color\":\"...\"}. "
              "If you cannot access the image, return {\"error\":\"image_not_accessible\"}. Do not guess."
              if attach_image else os.environ["CHATGPT_PROMPT"]
          )
          instructions = (
              (review_dir / "instructions.txt").read_text(encoding="utf-8").strip()
              if review_candidate else
              "Read the attached screenshot. Answer only from visible image content."
              if attach_image else
              "Use ChatGPT web search when the prompt asks for current local businesses. "
              "Return the answer directly and do not invent URLs or evidence."
          )
          (root / "prompt.txt").write_text(prompt + "\n", encoding="utf-8")
          (root / "instructions.txt").write_text(instructions + "\n", encoding="utf-8")
          PY
          image_args=()
          if [[ "$ATTACH_TEST_IMAGE" == "true" ]]; then
            image_args+=(--image-file artifacts/chatgpt-xvfb-probe/image-probe.png)
          elif [[ "$REVIEW_SAVED_CANDIDATE" == "true" ]]; then
            image_args+=(--image-file artifacts/chatgpt-xvfb-probe/website-review/desktop_top.jpg)
            image_args+=(--image-file artifacts/chatgpt-xvfb-probe/website-review/desktop_mid.jpg)
            image_args+=(--image-file artifacts/chatgpt-xvfb-probe/website-review/mobile_top.jpg)
            image_args+=(--image-file artifacts/chatgpt-xvfb-probe/website-review/mobile_mid.jpg)
          fi
          context_args=()
          if [[ "$REVIEW_SAVED_CANDIDATE" == "true" ]]; then
            context_args+=(--context-file artifacts/chatgpt-xvfb-probe/website-review/candidate-context.json)
          fi
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python tools/chatgpt_file_playwright_anonymous_ci.py \
              --stage-name chatgpt_runner_check \
              --input-file artifacts/chatgpt-xvfb-probe/prompt.txt \
              --instructions-file artifacts/chatgpt-xvfb-probe/instructions.txt \
              "${context_args[@]}" \
              --output-file artifacts/chatgpt-xvfb-probe/response.md \
              --metadata-output-file artifacts/chatgpt-xvfb-probe/metadata.json \
              --success-screenshot artifacts/chatgpt-xvfb-probe/chatgpt-response.png \
              --error-screenshot artifacts/chatgpt-xvfb-probe/chatgpt-error.png \
              --user-data-dir tmp/chatgpt-probe-profile \
              --allow-retry \
              --refresh-before-retry \
              --wait-seconds 70 \
              --timeout-ms 120000 \
              --post-response-wait-seconds 2 \
              --response-settle-seconds 2 \
              --max-settle-wait-seconds 30 \
              "${image_args[@]}"
          probe_rc=$?
          if [[ "$probe_rc" -eq 0 && "$ATTACH_TEST_IMAGE" == "true" ]]; then
            python tools/validate_chatgpt_image_probe.py \
              --response artifacts/chatgpt-xvfb-probe/response.md \
              --metadata artifacts/chatgpt-xvfb-probe/metadata.json \
              --output artifacts/chatgpt-xvfb-probe/probe-result.json || probe_rc=$?
          elif [[ "$probe_rc" -eq 0 && "$REVIEW_SAVED_CANDIDATE" == "true" ]]; then
            python tools/validate_chatgpt_visual_review.py \
              --response artifacts/chatgpt-xvfb-probe/response.md \
              --metadata artifacts/chatgpt-xvfb-probe/metadata.json \
              --context artifacts/chatgpt-xvfb-probe/website-review/candidate-context.json \
              --output artifacts/chatgpt-xvfb-probe/website-review/review-result.json || probe_rc=$?
          fi
          echo "exit_code=$probe_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload search or image attachment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chatgpt-xvfb-probe-${{ github.run_id }}
          path: artifacts/chatgpt-xvfb-probe/
          if-no-files-found: warn
          retention-days: 7

      - name: Report probe outcome
        if: always() && steps.probe.outputs.exit_code != '0'
        run: |
          echo "ChatGPT runner, image-recognition, or visual-review check failed. Review the uploaded response and diagnostics."
          exit 1
