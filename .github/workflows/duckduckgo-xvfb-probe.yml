name: DuckDuckGo Xvfb search probe

on:
  workflow_dispatch:
    inputs:
      query:
        description: "One DuckDuckGo query to run under Xvfb"
        required: true
        default: "in-ground pool companies Indianapolis, IN"
        type: string

permissions:
  contents: read

concurrency:
  group: duckduckgo-xvfb-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Xvfb and Playwright Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --disable-pip-version-check "playwright==1.58.0"
          python -m playwright install --with-deps chromium

      - name: Search DuckDuckGo once under Xvfb
        env:
          SEARCH_QUERY: ${{ inputs.query }}
        run: |
          mkdir -p artifacts/duckduckgo-xvfb-probe
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" \
            python tools/search_engine_xvfb_probe.py \
              --engine duckduckgo \
              --query "$SEARCH_QUERY" \
              --artifacts-dir artifacts/duckduckgo-xvfb-probe

      - name: Upload search evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: duckduckgo-xvfb-probe-${{ github.run_id }}
          path: artifacts/duckduckgo-xvfb-probe/
          if-no-files-found: warn
          retention-days: 7
