name: ChatGPT visual review batch

on:
  workflow_dispatch:
    inputs:
      review_run_key:
        description: "Run key for the lead-hunt artifact containing the candidate ledger and screenshots"
        required: true
        type: string
      review_source_run_id:
        description: "Lead-hunt Actions run ID (from its Actions URL)"
        required: true
        type: string
      review_candidate_ids:
        description: "Optional: candidate IDs separated by commas or newlines. Leave blank to select High/Medium candidates or candidates with absent/uncertain first-viewport hero media (up to 20)."
        required: false
        default: ""
        type: string
      refresh_screenshots:
        description: "Capture fresh desktop/mobile screenshots for an explicitly selected candidate (useful for a controlled rerun)"
        required: false
        default: false
        type: boolean
      automatic_retry_round:
        description: "Managed by the retry scheduler; leave at 0 for a manual review"
        required: false
        default: "0"
        type: string
      retry_request_id:
        description: "Managed by the retry scheduler; leave blank for a manual review"
        required: false
        default: ""
        type: string
      city_campaign_key:
        description: "Managed by the city-upload campaign coordinator"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read

# Share the repository-wide lock with every writer of the private operations repository.
concurrency:
  group: ${{ startsWith(inputs.review_run_key, 'human-high-calibration-') && format('human-high-calibration-{0}', github.repository) || format('website-lead-hunt-private-operations-{0}', github.repository) }}
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      candidate_ids: ${{ steps.matrix.outputs.candidate_ids }}
      selected_count: ${{ steps.matrix.outputs.selected_count }}
      selection_mode: ${{ steps.matrix.outputs.selection_mode }}
      run_key: ${{ steps.validate.outputs.run_key }}
      source_run_id: ${{ steps.validate.outputs.source_run_id }}
      retry_round: ${{ steps.validate.outputs.retry_round }}
      retry_request_id: ${{ steps.validate.outputs.retry_request_id }}
      city_campaign_key: ${{ steps.validate.outputs.city_campaign_key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out private operations data
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/website-lead-hunting-operations
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          persist-credentials: false
          path: private-results

      - name: Load candidate ledgers from private repository
        run: python tools/private_results.py copy-in --private-repo private-results

      - name: Validate batch and run key
        id: validate
        shell: bash
        env:
          REVIEW_RUN_KEY: ${{ inputs.review_run_key }}
          REVIEW_SOURCE_RUN_ID: ${{ inputs.review_source_run_id }}
          AUTOMATIC_RETRY_ROUND: ${{ inputs.automatic_retry_round }}
          RETRY_REQUEST_ID: ${{ inputs.retry_request_id }}
          CITY_CAMPAIGN_KEY: ${{ inputs.city_campaign_key }}
        run: |
          if ! [[ "$REVIEW_RUN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo "review_run_key contains invalid characters" >&2
            exit 1
          fi
          if ! [[ "$REVIEW_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "review_source_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          fi
          if ! [[ "$AUTOMATIC_RETRY_ROUND" =~ ^[0-2]$ ]]; then
            echo "automatic_retry_round must be between 0 and 2" >&2
            exit 1
          fi
          if [[ -n "$RETRY_REQUEST_ID" ]] && ! [[ "$RETRY_REQUEST_ID" =~ ^[A-Fa-f0-9,]{1,512}$ ]]; then
            echo "retry_request_id contains invalid characters" >&2
            exit 1
          fi
          if [[ "$AUTOMATIC_RETRY_ROUND" == "0" && -n "$RETRY_REQUEST_ID" ]] || \
             [[ "$AUTOMATIC_RETRY_ROUND" != "0" && -z "$RETRY_REQUEST_ID" ]]; then
            echo "automatic retry round and request ID must be provided together" >&2
            exit 1
          fi
          if [[ -n "$CITY_CAMPAIGN_KEY" ]] && ! [[ "$CITY_CAMPAIGN_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo "city_campaign_key contains invalid characters" >&2
            exit 1
          fi
          echo "run_key=$REVIEW_RUN_KEY" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$REVIEW_SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "retry_round=$AUTOMATIC_RETRY_ROUND" >> "$GITHUB_OUTPUT"
          echo "retry_request_id=$RETRY_REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "city_campaign_key=$CITY_CAMPAIGN_KEY" >> "$GITHUB_OUTPUT"

      - name: Build bounded candidate matrix
        id: matrix
        env:
          REVIEW_CANDIDATE_IDS: ${{ inputs.review_candidate_ids }}
          REVIEW_RUN_KEY: ${{ inputs.review_run_key }}
          RETRY_ROUND: ${{ inputs.automatic_retry_round }}
          RETRY_REQUEST_ID: ${{ inputs.retry_request_id }}
          CITY_CAMPAIGN_KEY: ${{ inputs.city_campaign_key }}
          SOURCE_RUN_ID: ${{ inputs.review_source_run_id }}
          REFRESH_SCREENSHOTS: ${{ inputs.refresh_screenshots }}
        run: |
          matrix_args=()
          if [[ "$REFRESH_SCREENSHOTS" == "true" ]]; then
            matrix_args+=(--refresh-screenshots)
          fi
          python tools/build_visual_review_matrix.py \
            --candidate-ids "$REVIEW_CANDIDATE_IDS" \
            --run-dir "runs/$REVIEW_RUN_KEY" \
            --retry-round "$RETRY_ROUND" \
            --retry-request-id "$RETRY_REQUEST_ID" \
            --source-run-id "$SOURCE_RUN_ID" \
            "${matrix_args[@]}" \
            --github-output "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          values = {}
          for line in Path(os.environ["GITHUB_OUTPUT"]).read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key] = value
          ids = json.loads(values["candidate_ids"])
          mode = values.get("selection_mode", "manual")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Visual review batch plan\n\n")
              summary.write(f"- Selection: **{mode}**\n")
              summary.write(f"- Candidates dispatched: **{len(ids)}** (maximum 20)\n")
              if mode == "automatic":
                  summary.write(f"- Eligible candidates at planning time: **{values.get('eligible_count', 'unknown')}**\n")
                  summary.write(f"- Remaining after this batch: **{values.get('remaining_eligible', 'unknown')}**\n")
                  if not ids:
                      summary.write("\n**No eligible candidates; batch complete.** No review jobs were needed.\n")
              if ids:
                  summary.write("\nEach batch is merged and committed before a later batch is started. Leave candidate IDs blank on the next manual dispatch to resume from the committed ledger.\n")
          PY

  review_site:
    needs: plan
    if: needs.plan.outputs.selected_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install chromium
          mkdir -p artifacts/chatgpt-visual-review tmp
          rm -rf tmp/chatgpt-visual-review-profile

      - name: Download lead-hunt artifact for this candidate
        id: source_artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lead-hunt-${{ needs.plan.outputs.run_key }}-${{ needs.plan.outputs.source_run_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run_id }}
          path: artifacts/lead-hunt-source/runs/${{ needs.plan.outputs.run_key }}

      - name: Recapture desktop and mobile pages after an uncertain assessment
        id: recapture
        if: matrix.recapture_screenshots == true
        continue-on-error: true
        shell: bash
        env:
          REVIEW_RUN_KEY: ${{ needs.plan.outputs.run_key }}
          REVIEW_CANDIDATE_ID: ${{ matrix.candidate_id }}
        run: |
          ARTIFACT_RUN_DIR="artifacts/lead-hunt-source/runs/$REVIEW_RUN_KEY"
          RECAPTURE_DIR="artifacts/chatgpt-visual-review/$REVIEW_CANDIDATE_ID/recaptured"
          mkdir -p "$RECAPTURE_DIR"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python tools/recapture_visual_review_screenshots.py \
              --run-dir "$ARTIFACT_RUN_DIR" \
              --candidate-id "$REVIEW_CANDIDATE_ID" \
              --output-dir "$RECAPTURE_DIR" \
              > "$RECAPTURE_DIR/recapture.log" 2>&1

      - name: Prepare this candidate's four desktop/mobile top and mid screenshots
        id: prepare
        continue-on-error: true
        shell: bash
        env:
          REVIEW_RUN_KEY: ${{ needs.plan.outputs.run_key }}
          REVIEW_CANDIDATE_ID: ${{ matrix.candidate_id }}
          RECAPTURE_REQUIRED: ${{ matrix.recapture_screenshots }}
          RECAPTURE_OUTCOME: ${{ steps.recapture.outcome }}
        run: |
          ARTIFACT_RUN_DIR="artifacts/lead-hunt-source/runs/$REVIEW_RUN_KEY"
          if [[ ! -f "$ARTIFACT_RUN_DIR/CANDIDATE_LEDGER.jsonl" ]]; then
            echo "Lead-hunt artifact is unavailable or expired; checked-out repository screenshots are not used as a fallback." >&2
            exit 1
          fi
          prepare_args=()
          if [[ "$RECAPTURE_REQUIRED" == "true" ]]; then
            if [[ "$RECAPTURE_OUTCOME" != "success" ]]; then
              echo "This uncertain-result retry requires fresh screenshots, but recapture did not succeed." >&2
              exit 1
            fi
            prepare_args+=(--screenshot-override-dir "artifacts/chatgpt-visual-review/$REVIEW_CANDIDATE_ID/recaptured")
          fi
          python tools/prepare_chatgpt_visual_review.py \
            --run-dir "$ARTIFACT_RUN_DIR" \
            --candidate-id "$REVIEW_CANDIDATE_ID" \
            --output-dir "artifacts/chatgpt-visual-review/$REVIEW_CANDIDATE_ID/website-review" \
            "${prepare_args[@]}"

      - name: Assess screenshots with the proven in-session retry behavior
        id: review
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          REVIEW_CANDIDATE_ID: ${{ matrix.candidate_id }}
        run: |
          REVIEW_DIR="artifacts/chatgpt-visual-review/$REVIEW_CANDIDATE_ID"
          ATTEMPT_ROOT="$REVIEW_DIR/attempts"
          mkdir -p "$ATTEMPT_ROOT"
          ATTEMPT_DIR="$ATTEMPT_ROOT/1"
          mkdir -p "$ATTEMPT_DIR"
          review_rc=0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python tools/chatgpt_file_playwright_anonymous_ci.py \
              --stage-name chatgpt_visual_review \
              --input-file "$REVIEW_DIR/website-review/prompt.txt" \
              --instructions-file "$REVIEW_DIR/website-review/instructions.txt" \
              --context-file "$REVIEW_DIR/website-review/candidate-context.json" \
              --output-file "$ATTEMPT_DIR/response.md" \
              --metadata-output-file "$ATTEMPT_DIR/metadata.json" \
              --success-screenshot "$ATTEMPT_DIR/chatgpt-response.png" \
              --error-screenshot "$ATTEMPT_DIR/chatgpt-error.png" \
              --network-log \
              --network-log-file "$ATTEMPT_DIR/chatgpt-network.log" \
              --user-data-dir "tmp/chatgpt-visual-review-profile-$REVIEW_CANDIDATE_ID" \
              --allow-retry \
              --refresh-before-retry \
              --wait-seconds 70 \
              --timeout-ms 120000 \
              --post-response-wait-seconds 2 \
              --response-settle-seconds 2 \
              --max-settle-wait-seconds 30 \
              --expect-review-score \
              --image-file "$REVIEW_DIR/website-review/desktop_top.jpg" \
              --image-file "$REVIEW_DIR/website-review/desktop_mid.jpg" \
              --image-file "$REVIEW_DIR/website-review/mobile_top.jpg" \
              --image-file "$REVIEW_DIR/website-review/mobile_mid.jpg" \
              > "$ATTEMPT_DIR/runner.log" 2>&1 || review_rc=$?

          if [[ "$review_rc" -eq 0 ]]; then
            python tools/validate_chatgpt_visual_review.py \
              --response "$ATTEMPT_DIR/response.md" \
              --metadata "$ATTEMPT_DIR/metadata.json" \
              --context "$REVIEW_DIR/website-review/candidate-context.json" \
              --output "$ATTEMPT_DIR/review-result.json" \
              > "$ATTEMPT_DIR/validation.log" 2>&1 || review_rc=$?
          fi

          python - "$ATTEMPT_DIR" "$review_rc" <<'PY'
          import json, sys
          from pathlib import Path
          from tools.visual_review_status import classify_attempt
          attempt_dir = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          result_path = attempt_dir / "review-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.is_file() else None
          runner_log_path = attempt_dir / "runner.log"
          runner_log = runner_log_path.read_text(encoding="utf-8", errors="replace") if runner_log_path.is_file() else ""
          decision = classify_attempt(
              source_artifact_available=True,
              preparation_ok=True,
              process_exit_code=exit_code,
              result=result,
              runner_log_text=runner_log,
          )
          decision["attempt"] = int(attempt_dir.name)
          (attempt_dir / "attempt-status.json").write_text(json.dumps(decision, indent=2) + "\n", encoding="utf-8")
          print(decision["status"])
          PY
          final_status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$ATTEMPT_DIR/attempt-status.json")
          if [[ -f "$ATTEMPT_DIR/review-result.json" ]]; then
            cp "$ATTEMPT_DIR/review-result.json" "$REVIEW_DIR/website-review/review-result.json"
          fi
          if [[ -f "$ATTEMPT_DIR/response.md" ]]; then
            cp "$ATTEMPT_DIR/response.md" "$REVIEW_DIR/response.md"
          fi
          if [[ -f "$ATTEMPT_DIR/metadata.json" ]]; then
            cp "$ATTEMPT_DIR/metadata.json" "$REVIEW_DIR/metadata.json"
          fi

          python - "$REVIEW_DIR" "$final_status" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          review_dir = Path(sys.argv[1])
          attempts = []
          for path in sorted((review_dir / "attempts").glob("*/attempt-status.json"), key=lambda p: int(p.parent.name)):
              attempts.append(json.loads(path.read_text(encoding="utf-8")))
          envelope = {
              "candidate_id": review_dir.name,
              "status": sys.argv[2],
              "completed_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "failure_class": attempts[-1].get("failure_class") if attempts and sys.argv[2] != "passed" else None,
              "error": attempts[-1].get("error") if attempts and sys.argv[2] != "passed" else None,
              "attempts": attempts,
          }
          (review_dir / "review-envelope.json").write_text(json.dumps(envelope, indent=2) + "\n", encoding="utf-8")
          with open(Path(__import__("os").environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as output:
              output.write(f"status={envelope['status']}\n")
          PY

      - name: Write per-candidate terminal status
        id: envelope
        if: always()
        env:
          REVIEW_CANDIDATE_ID: ${{ matrix.candidate_id }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outputs.status || steps.review.outcome }}
          SOURCE_ARTIFACT_OUTCOME: ${{ steps.source_artifact.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          candidate_id = os.environ["REVIEW_CANDIDATE_ID"]
          review_dir = Path("artifacts/chatgpt-visual-review") / candidate_id
          result_path = review_dir / "website-review" / "review-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.is_file() else None
          source_available = os.environ.get("SOURCE_ARTIFACT_OUTCOME") == "success"
          preparation_ok = os.environ.get("PREPARE_OUTCOME") == "success"
          attempts = []
          for path in sorted((review_dir / "attempts").glob("*/attempt-status.json"), key=lambda p: int(p.parent.name)):
              attempts.append(json.loads(path.read_text(encoding="utf-8")))
          if attempts:
              decision = attempts[-1]
              status = decision["status"]
              failure_class = decision.get("failure_class")
              error = decision.get("error")
          else:
              from tools.visual_review_status import classify_attempt
              decision = classify_attempt(
                  source_artifact_available=source_available,
                  preparation_ok=preparation_ok,
                  process_exit_code=None,
                  result=result,
                  preparation_error="Candidate screenshots could not be prepared from the source artifact.",
              )
              status, failure_class, error = decision["status"], decision["failure_class"], decision["error"]
          envelope = {
              "candidate_id": candidate_id,
              "status": status,
              "completed_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "source_artifact_outcome": os.environ.get("SOURCE_ARTIFACT_OUTCOME"),
              "prepare_outcome": os.environ.get("PREPARE_OUTCOME"),
              "review_outcome": os.environ.get("REVIEW_OUTCOME"),
              "failure_class": failure_class,
              "attempts": attempts,
              "error": error,
          }
          review_dir.mkdir(parents=True, exist_ok=True)
          (review_dir / "review-envelope.json").write_text(json.dumps(envelope, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"status={envelope['status']}\n")
          PY

      - name: Upload candidate review and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-review-${{ github.run_id }}-${{ matrix.candidate_id }}
          path: artifacts/chatgpt-visual-review/${{ matrix.candidate_id }}/
          if-no-files-found: error
          retention-days: 7

      - name: Report this candidate review outcome
        if: always() && steps.envelope.outputs.status != 'passed'
        env:
          REVIEW_STATUS: ${{ steps.envelope.outputs.status }}
          REVIEW_CANDIDATE_ID: ${{ matrix.candidate_id }}
        run: echo "Candidate $REVIEW_CANDIDATE_ID ended with status $REVIEW_STATUS; its diagnostics and status are saved in the candidate artifact."

  merge_reviews:
    needs: [plan, review_site]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.selected_count != '0'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Check out private operations data
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/website-lead-hunting-operations
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          persist-credentials: false
          path: private-results

      - name: Load candidate ledgers from private repository
        run: python tools/private_results.py copy-in --private-repo private-results

      - name: Download per-candidate review artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: visual-review-${{ github.run_id }}-*
          path: artifacts/visual-review-results
          merge-multiple: false

      - name: Merge scores and attempts into candidate records
        id: merge
        continue-on-error: true
        env:
          RUN_KEY: ${{ needs.plan.outputs.run_key }}
          CANDIDATE_IDS: ${{ needs.plan.outputs.candidate_ids }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          AUTOMATIC_RETRY_ROUND: ${{ needs.plan.outputs.retry_round }}
          RETRY_REQUEST_ID: ${{ needs.plan.outputs.retry_request_id }}
          CITY_CAMPAIGN_KEY: ${{ needs.plan.outputs.city_campaign_key }}
        run: |
          python tools/merge_chatgpt_visual_reviews.py \
            --ledger "runs/$RUN_KEY/CANDIDATE_LEDGER.jsonl" \
            --results-dir artifacts/visual-review-results \
            --candidate-ids "$CANDIDATE_IDS" \
            --source-run-id "$SOURCE_RUN_ID" \
            --review-run-id "$REVIEW_RUN_ID" \
            --automatic-retry-round "$AUTOMATIC_RETRY_ROUND" \
            --retry-request-id "$RETRY_REQUEST_ID" \
            --city-campaign-key "$CITY_CAMPAIGN_KEY" \
            --output "runs/$RUN_KEY/CHATGPT_VISUAL_REVIEW_BATCH.json"

      - name: Refresh validated run summary
        if: always()
        env:
          RUN_KEY: ${{ needs.plan.outputs.run_key }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          run_dir = Path("runs") / os.environ["RUN_KEY"]
          manifest_path = run_dir / "RUN_MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.is_file() else {}
          if manifest.get("run_type") == "human_high_calibration_capture":
              message = "Calibration screenshot cohort: lead-hunt run validation is not applicable."
              print(message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\n" + message + "\n")
          else:
              subprocess.run(["python", "tools/validate_run.py", "--run-dir", str(run_dir), "--write-summary"], check=True)
          PY

      - name: Refresh high and medium candidate export
        if: always()
        env:
          RUN_KEY: ${{ needs.plan.outputs.run_key }}
        run: |
          if [[ -f "runs/$RUN_KEY/CANDIDATE_LEDGER.jsonl" ]]; then
            python tools/export_high_medium_candidates.py --run-dir "runs/$RUN_KEY"
          fi

      - name: Write partial-results report
        if: always()
        env:
          RUN_KEY: ${{ needs.plan.outputs.run_key }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary_path = Path("runs") / os.environ["RUN_KEY"] / "CHATGPT_VISUAL_REVIEW_BATCH.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n## Visual review results\n\n")
              if not summary_path.is_file():
                  report.write("The batch merge did not produce a durable results summary. Check the merge job diagnostics.\n")
                  raise SystemExit(0)
              data = json.loads(summary_path.read_text(encoding="utf-8"))
              statuses = data.get("statuses", {})
              passed = int(statuses.get("passed", 0))
              retry = int(statuses.get("retry-needed", 0))
              failed = int(statuses.get("failed", 0))
              total = int(data.get("total", passed + retry + failed))
              report.write(f"**{passed}/{total} passed · {retry} retry-needed · {failed} failed**\n\n")
              report.write("A green workflow means results were recorded and committed; it does not mean every candidate passed. Candidate-level outcomes are authoritative in the ledger.\n\n")
              report.write("| Status | Count | Candidate IDs |\n|---|---:|---|\n")
              for status in ("passed", "retry-needed", "failed"):
                  ids = data.get("candidate_ids_by_status", {}).get(status, [])
                  report.write(f"| {status} | {statuses.get(status, 0)} | {', '.join(ids) if ids else '—'} |\n")
          PY

      - name: Commit durable scorecards and run summary to private repository
        if: always()
        shell: bash
        env:
          RUN_KEY: ${{ needs.plan.outputs.run_key }}
          PRIVATE_RESULTS_TOKEN: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
        run: |
          python tools/private_results.py commit-run --private-repo private-results \
            --run-key "$RUN_KEY" --message "Save ChatGPT visual reviews: $RUN_KEY"

      - name: Report candidate job interruptions
        if: always() && needs.review_site.result != 'success'
        run: echo "One or more candidate jobs did not complete normally. Their missing results are recorded as retry-needed; see the run summary and per-candidate artifacts."

      - name: Fail if the review merge could not be written
        if: always() && steps.merge.outcome != 'success'
        run: |
          echo "The review results could not be merged into the candidate ledger. See the merge step diagnostics."
          exit 1

  notify_city_campaign:
    needs: [plan, review_site, merge_reviews]
    if: always() && inputs.city_campaign_key != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch city campaign checkpoint after visual review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
          CITY_CAMPAIGN_KEY: ${{ inputs.city_campaign_key }}
          CHILD_RUN_ID: ${{ github.run_id }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_COUNT: ${{ needs.plan.outputs.selected_count }}
          MERGE_RESULT: ${{ needs.merge_reviews.result }}
        run: |
          child_conclusion=success
          if [[ "$PLAN_RESULT" != "success" ]] || \
             [[ "$SELECTED_COUNT" != "0" && "$MERGE_RESULT" != "success" ]]; then
            child_conclusion=failure
          fi
          payload=$(jq -n \
            --arg ref "$TARGET_REF" \
            --arg campaign_key "$CITY_CAMPAIGN_KEY" \
            --arg child_run_id "$CHILD_RUN_ID" \
            --arg child_conclusion "$child_conclusion" \
            '{ref:$ref,inputs:{mode:"after-visual-review",campaign_key:$campaign_key,child_run_id:$child_run_id,child_conclusion:$child_conclusion}}')
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/city-upload-campaign.yml/dispatches" \
              --data "$payload"; then
              echo "City campaign notified for visual-review run $CHILD_RUN_ID."
              exit 0
            fi
            echo "City campaign callback attempt $attempt failed." >&2
            sleep 5
          done
          echo "City campaign callback could not be dispatched after three attempts." >&2
          exit 1
